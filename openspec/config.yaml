schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Proyecto SENIALON: radar de oportunidades editoriales de IA para líderes y equipos de LatAm.
  Continuidad vigente FE 1.10 autorizada: guía frontend/INTEGRACION.md y suite nueva playwright.integration.config.ts con Next/FastAPI y PostgreSQL temporal reales, proveedores siempre interceptados y env del equipo sin cargar. Cuatro Playwright aprobados, guardado UI y recuperación idéntica tras reinicio del proceso Python y otro contexto de navegador; lecturas no repiten llamadas. 576 Vitest, 74 ejemplos tipados, TypeScript/lint/build aprobados y 17 artefactos cliente sin marcadores privados; 325 Python aprobadas y tres omitidas sin PostgreSQL. Primera pasada 2/4 y segunda 4/4 tras corregir guion, sin cambios de producto. No ejecutar suites antiguas rechazadas. Lecturas posteriores desplegadas con acceso del README remoto, sin copiar valores ni mutar datos: raíz y /api/v1/meta 200 privados; /api/v1/runs 500 INTERNAL_ERROR. Evidencia frontend/verification/integration-deployed-readonly.json. Dos commits de solo README incorporados por fast-forward hasta 0c0ea19; revisar con BE la publicación y rotación del acceso de demo. Usuario confirma DATABASE_URL/migración aún no preparadas en despliegue; configurarlas y repetir GET, sin presumir causa exacta del 500. Archivos reales no encontrados localmente, solo plantillas y .env.local raíz con variable OIDC. FE 1.10 abierta por error de datos/configuración/cuentas/costos/persistencia y prueba desde otro equipo físico. Resolver además en BE 3.9/3.10/3.11 la continuidad ante canal incierto que hoy bloquea el corpus; no alterar reservas desde FE. No iniciar proveedores reales, pagos, cuentas o despliegues por esta suite. Backend, contrato/hash, dependencias y diseño global intactos; priorizar esas dependencias y preparar FE 1.11 con límites explícitos.
  Continuidad vigente FE 1.9 autorizada: registro editorial en frontend/src/components/analysis/editorial-review.tsx y frontend/src/app/review-actions.ts; guía frontend/REVISION_EDITORIAL.md. Decisión/motivo obligatorio/evidencia se registran juntos con versión/revisión exactas y confirmación validada. Guardado separado del borrador, current_actions vigente e históricos en lectura. Recibo record_review contiene metadatos y entrada editorial pendiente, nunca resultados/credenciales; conservar texto ante fallos, consultar por GET y permitir solo reenvío manual idéntico tras conciliación, sin mezclar históricos. 576 Vitest (42 nuevas), 18 Playwright nuevos exclusivos, typecheck/lint/build y 74 ejemplos tipados aprobados; 17 artefactos cliente sin marcadores privados. Prueba separada Python/PostgreSQL temporal con proveedores simulados comprueba PUT/conflictos/recuperación al recrear la aplicación. Pendiente cierre integrado Next–Python desplegado, persistencia del equipo y reinicio real; FE 1.9 y BE 3.5/3.12 no se cierran por estas pruebas. Siguiente implementación FE 1.10. Backend, contrato/hash, dependencias y diseño global intactos; no reejecutar suites antiguas rechazadas, iniciar proveedores, configurar secretos o desplegar por esta entrega. Sustituye la exclusión del formulario de FE 1.8; las continuidades anteriores registran sus entregas históricas.
  Continuidad vigente FE 1.8 autorizada después de FE 1.7: ficha protegida recuperable en frontend/src/app/runs/[runId]/analyses/[analysisId]/page.tsx, UI en frontend/src/components/analysis/ y guía frontend/FICHA.md. Métricas/señal/observaciones/evidencia/valor/afinidad/hipótesis/adaptación separadas y revisión de la versión visible; insuficiencias y fallos conservan datos disponibles. GET solo lee; avance explícito de una unidad con revisión/versión/clave, recibo advance_analysis y recuperación por GET/checkpoint sin reenvío automático. Capacidades solo del envelope current_actions; URL con versión fijada es lectura. 534 Vitest (54 nuevas), 14 Playwright nuevos exclusivos FE 1.8, typecheck/lint/build y 74 ejemplos tipados aprobados; 17 artefactos cliente sin marcadores privados. Contrato/hash, backend y diseño global intactos; no reejecutar suites antiguas rechazadas. Cierre integrado ALG 2.7–2.9, BE 3.7/3.10/3.11, persistencia y despliegue auténticos pendiente. FE 1.9 es la siguiente implementación, sin formulario aún. No iniciar proveedores, cuentas, secretos ni despliegues por esta entrega. Esta autorización posterior sustituye la exclusión de ficha de la entrega FE 1.7.
  Continuidad FE 1.7 autorizada en frontend/PUBLICACIONES.md y frontend/src/components/publications/. Catálogo paginado e inspección GET independientes de grupos/comparación; selectAnalysis guarda selección sin solicitar advance_analysis. Recibo select_analysis, recuperación por GET y reenvío manual solo tras lectura completa con revisión/clave originales vigentes. 480 Vitest (49 nuevas), 13 Playwright nuevos exclusivos FE 1.7, typecheck/lint/formato/build y 74 ejemplos tipados aprobados; 14 artefactos cliente sin marcadores privados. No reejecutar suites antiguas rechazadas. Backend, contrato 1.0.0/hash y sistema visual global intactos. Cierre FE 1.7 con corpus, JEV de pertinencia, persistencia real BE 3.8–3.11/ALG 2.3 y recorrido desplegado pendiente. Datos sintéticos solo de pruebas; no implementar análisis/ficha/revisión de FE 1.8/1.9 ni iniciar proveedores por esta entrega.
  Continuidad FE 1.6 autorizada: comparación temática y acciones en frontend/src/components/comparison/ y frontend/src/app/comparison-actions.ts; guía frontend/COMPARACION.md. A/B, diferencia/porcentaje permitidos, base cero, desconocidos y respaldo por canal se muestran desde el contrato, sin recalcular señales. GET no calcula; avance explícito con confirmación exacta, recibo compare y recuperación sin POST automático. 431 Vitest (45 nuevas), ocho Playwright nuevos exclusivos de FE 1.6, typecheck/lint/formato/build aprobados y 14 artefactos cliente sin marcadores privados. No se reejecutaron los E2E anteriores rechazados; sus pendientes se conservan. Contrato 1.0.0/hash, backend y sistema visual global intactos. FE 1.6 conserva el cierre integrado pendiente con persistencia, BE 3.11/3.12, ALG 2.5/2.6 y recorrido desplegado. Escenarios sintéticos solo de pruebas, nunca producto/demo ni validación de cuentas/proveedores reales.
  Integración posterior autorizada desde ../senialon-compatible sin Git: conservar frontend, guardas, contrato 1.0.0/hash y ALG 2.2/2.5/2.6. Operaciones PostgreSQL y adaptadores sobre transporte/gate común en senialon_api; rúbricas/prompts en analysis. Derivado backend del contrato para empaquetado, nunca otra autoridad. Ver docs/INTEGRACION_JEV.md y backend/README.md. Pruebas locales con proveedores simulados y BD temporal no cierran cuentas reales, pago, Supabase o Vercel. GEMINI_MODEL explícito y pagos deshabilitados por defecto. Integración publicada a main en a085285 por solicitud del usuario.
  Decisión vigente de despliegue: el usuario confirmó proyecto en la cuenta Vercel Hobby de albcamargo, conectado al repositorio original y con URL https://corefex-psi.vercel.app. Vercel despliega main por integración Git nativa. Workflow .github/workflows/deploy-main.yml conserva íntegro el job verify de frontend/Python y elimina deploy, CLI y secretos de Vercel. CI y despliegue son independientes; no se añade una puerta de CI a Vercel. Guía docs/DESPLIEGUE_GITHUB_ACTIONS.md. Acceso configurado, binding desplegado, límites efectivos y persistencia/proveedores reales conservan sus verificaciones pendientes; BE 3.3/3.6 y FE 1.3 siguen abiertas. No solicitar valores secretos en el chat, modificar cuentas, iniciar proveedores o reintentar los E2E rechazados por actualizar el workflow.
  Leer docs/DEFINICION_MVP.md, docs/PLAN_DE_TRABAJO.md y los artefactos del cambio definir-mvp-senialon.
  El usuario autorizó FE 1.2/BE 3.2 y después continuar con FE 1.1. La base y entrega frontend están en frontend/README.md y frontend/VERIFICACION.md; FE 1.1 completa ambos hitos con tipos/validación locales y evidencia en frontend/CONTRATO_API.md. La siguiente FE es 1.3 con dependencias BE 3.3/3.6, todavía sin HTTP, autenticación o despliegue implementados. El control offline de docs/budget/README.md conserva pendiente verificar cargos previos, modelos, saldos y mínimos de cuenta antes de pruebas pagadas. No desplegar sin protección ni ejecutar el prototipo o reintentar la instalación cancelada de validadores.
  Autorización posterior: avanzar el backend que desbloquea FE. BE 3.3 prepara FastAPI/Python 3.12, guard de acceso/origen, metadatos y Services con SENIALON_BACKEND_URL; evidencia en backend/README.md y backend/VERIFICACION.md. Binding desde el proceso Node verificado localmente con cuatro respuestas contractuales, 52 pruebas backend y frontend conservado. No es aún un Route Handler o despliegue probado. FE 1.3 puede iniciarse localmente; BE 3.3 sigue abierta por proyecto/equipo, límites/costos efectivos y primer despliegue protegido. Guard adelantado de BE 3.6 sin cierre de entrega conjunta. Mantener bloqueado el despliegue público sin protección y las pruebas pagadas sin verificar BE 3.2.
  Autorización posterior: continuar FE 1.3. Acceso y BFF implementados con guardas independientes, validación de entradas/respuestas y Route Handler que consulta FastAPI por el binding generado. Evidencia en frontend/ACCESO.md con 326 Vitest, 9 Playwright locales, separación de secretos en build/logs y 6 comprobaciones de Services. El contrato conserva versión/hash y 94 esquemas; los métodos/paths y esquemas de request también son derivados FE. Notion no está activo. El usuario confirmó que aún no existe proyecto Vercel: cierre FE 1.3/despliegue BE 3.3 y secretos BE 3.6 pendientes. Los tests no acreditan proveedores, datos o persistencia; no consumir servicios de pago sin BE 3.2.
  El contrato único docs/contracts/openapi.json conserva autoridad BE y está acordado en 1.0.0, con registro/política en docs/contracts/README.md. ALG 2.1 e interfaces se documentan en docs/REVISION_SEMANTICA_ALG.md y docs/INTERFACES_ANALISIS.md; FE conserva conformidad documental en docs/REVISION_CONTRATO_FRONTEND.md. ALG 2.1 y BE 3.1 están cerradas documentalmente; G0 contractual cerrado mediante revisión asistida por Codex a solicitud del usuario, sin atribuir firmas a los otros integrantes ni servicios probados.
  El borrador competidor de ae6b1a0 se retiró del árbol activo. openspec/contract/README.md registra decisiones de conciliación y recuperación del antecedente desde Git; no contiene otro esquema. No restaurar dos contratos como autoridades simultáneas ni atribuir al antecedente inválido las validaciones del contrato actual.
  Autorización posterior: continuar FE 1.4. Interfaz de ejecuciones, cobertura y recuperación en frontend/, con Server Actions que reutilizan guardas/validación del BFF y guía frontend/EJECUCIONES.md. Historial/cursor, ventanas recibidas, once fuentes, etapas y operaciones recuperables sin checkpoint; creación y avance explícitos, recibo local versionado y reenvío manual solo tras GET/política permitida, sin reintentos automáticos. El servidor de escenarios de dominio es exclusivo de pruebas sintéticas y no se integra en producto/demo. Backend solo ofrece metadatos; FE 1.4 sigue abierta por BE 3.5/3.9/3.10/3.11, ALG 2.2, persistencia y despliegue reales. El contrato conserva versión/hash. No usar resultados sintéticos como evidencia de adquisición, persistencia, análisis o gasto real.
  Continuidad coordinada de implementación/pruebas: ALG 2.2 entrega analysis.derive_windows en backend/analysis/windows.py. Recibe datetime con zona explícita y calcula medianoches America/Bogota; devuelve instantes UTC RFC 3339 conservando la zona de corte. 27 pruebas nuevas, 79 Python totales y nueve salidas aceptadas por el esquema canónico sin modificarlo. BE integrará/persistirá la salida una vez y FE la muestra. Guía backend/analysis/README.md; pytest tests analysis/tests incluye ambas suites sin cambiar configuración BE. FE 1.4 sigue abierta por operaciones/persistencia/despliegue reales; no iniciar proveedores, manipular secretos o suponer cuentas/gasto por esta entrega pura.
  Continuidad posterior: ALG 2.5 y 2.6 entregan analysis.count_publications y analysis.compare_topics como funciones puras. Contexto con revisión, ventanas persistidas, versiones, once fuentes, input_version e instante BE. Conteos con confirmación/evidencia/IDs/fuentes y desconocidos; comparación canónica con cobertura común, fórmula/base cero o partial sin delta/%/novedad. 55 pruebas nuevas de conteo y 45 de comparación; 179 Python totales, seis Count y ocho Comparison calculadas aceptadas por Ajv/1.0.0 existente. Guía backend/analysis/README.md. Mantener separados datos sintéticos de pruebas e integración auténtica BE 3.11/ALG 2.11. FE 1.4 sigue abierta; no llamar proveedores, generar cuentas/secretos, desplegar o ejecutar cálculo desde GET por estos cierres puros.
  Equipo confirmado de tres integrantes: Frontend (FE), Algoritmia/JEV (ALG) y Backend/infraestructura (BE). Cada tarea tiene un único dueño; revisiones y dependencias no transfieren propiedad.
  Preparación FE 1.5 en frontend/GRUPOS.md: inspección y confirmación de versión exacta con evidencia, sin edición manual, cálculo o aprobación editorial implícitos. Acciones protegidas y recibo confirm_groups compartido. 386 Vitest y build aprobados; primera E2E sintética 19/21, dos errores de pruebas corregidos con reintento rechazado/no ejecutado. No repetir por otra vía ni presentar esos dos casos como aprobados. FE 1.5 sigue abierta por integración BE 3.11/3.12 y ALG 2.3/2.4, persistencia/despliegue reales.
  El usuario asume FE. Leer docs/PLAN_FRONTEND.md para prioridades y dependencias. FE 1.1 tiene ambos hitos completos sobre el contrato 1.0.0; los derivados de frontend/src/lib/api/generated/ no son otra autoridad. contract:check detecta desactualización antes del build; el validador es server-only y los componentes cliente solo importan tipos. Mantener independientes catálogo/análisis de pieza y comparación temática; QA y borrador de playbook son continuos.
  FE posee frontend, Next Route Handlers y autenticación web, UI/pruebas E2E y playbook. ALG posee backend/analysis, ventanas, reglas, prompts/rúbricas JEV/Gemini, cálculos y evaluación, sin HTTP/BD/secretos directos. BE posee resto backend, adquisición técnica, adaptadores, contrato API, persistencia/gasto, infraestructura, README operativo y paquete/envío humano.
  BE publica el borrador del contrato; ALG revisa semántica y FE consumo; BE cierra una versión común. ALG usa adaptadores autenticados inyectados por BE. Ventanas y conteos se implementan una sola vez en ALG.
  G0 cerrado se refiere al acuerdo documental del contrato. BE 3.2 permanece pendiente y es obligatorio antes de cualquier prueba pagada; BE 3.10 reclama y reserva antes de cada llamada de la aplicación, incluidos subpasos de un lote. Accesos, gasto, persistencia, despliegue y evaluación real no quedan verificados por el contrato.
  Corpus fijo de 11 canales: conservar las URLs exactas de la definición y youtube-corpus.
  Videos públicos de hasta 180 segundos, IA central o aplicación concreta; mención incidental insuficiente. Distinguir candidato corto de Short confirmado.
  Contexto automático de YouTube; comparar últimos 7 días completos frente a los 7 anteriores en America/Bogota, UTC−5, excluyendo el día actual.
  Señales SOLO por tema principal: cada ID cuenta una vez. Secundarios visibles sin sumar. Formato solo en piezas elegidas para análisis profundo.
  Proponer grupos automáticamente a partir de ambas ventanas, con evidencia y versión; el operador confirma antes del cálculo. Sin edición manual de clasificaciones en la demo.
  El operador puede elegir cualquier pieza elegible para análisis profundo, incluso sin crecimiento. Formato, valor y afinidad no bloquean por sí solos cobertura temática.
  Mostrar conteos, diferencia y porcentaje con base positiva evaluable; cero conocido y reciente positiva = nuevo en el corpus sin porcentaje. Desconocido no equivale a cero.
  Demo con cobertura parcial explícita aceptable; comparación completa de 11 canales pendiente si faltan datos. No atribuir novedad o crecimiento completo a una base incompleta.
  Separar métricas observadas, señal temática, valor, afinidad, hipótesis y propuestas; sin causalidad, crecimiento de audiencia, saturación ni predicción supuesta.
  JEV obligatorio para pertinencia IA, valor y afinidad por persona, contexto empresarial y pilar; entradas/salidas reales, modelo y criterios registrados.
  Valor: aporte respaldado / utilidad no sustentada / información insuficiente.
  Pilares aprobados: ROI y costos de IA; automatización comercial con IA; eficiencia operativa con IA; liderazgo aplicado a IA; otro pertinente; información insuficiente.
  La afinidad no altera conteos ni infiere quién vio la pieza. LatAm es el mercado editorial, no una medición de espectadores.
  Web desplegada en Vercel, protegida por una credencial de demo compartida para toda la app. No modo público ni cuentas individuales.
  Persistencia duradera de ejecuciones, evidencia, confirmación de grupos y decisiones tras cerrar navegador o reiniciar app.
  Frontend confirmado: mismo stack de personal-finance-assistant con App Router, React/React DOM 19.3.0, TypeScript 5.9.3, npm y Node >=24.21.0 <25. FE 1.2 fija Next.js y eslint-config-next 16.3.8 como parche de seguridad de la referencia 16.3.3. ESLint, Prettier y Vitest 5.0.1 configurados; Playwright para el recorrido protegido y el cierre de FE 1.10 siguen pendientes.
  Python para análisis y Vercel para despliegue confirmados. Arquitectura recomendada: Next.js público y FastAPI/Python interno mediante Vercel Services con binding; PostgreSQL en Supabase Free. Verificar despliegue, autenticación de ambos servicios y límites antes de ampliar desarrollo.
  Reutilizar el stack frontend no implica copiar código, branding, autenticación ni dominio financiero del proyecto de referencia. Mantener identidad de SENIALON; no asumir Tailwind ni shadcn/ui como dependencias existentes.
  Gemini declarado configurado sin prueba real desde SENIALON; el despliegue vigente usa Vercel Hobby de albcamargo con Git nativo a main, sustituyendo la ruta anterior del plan de pago del usuario. YouTube Data API, JEV y persistencia conservan configuración/verificación real pendiente.
  Presupuesto máximo de 20 USD para NUEVOS consumos de APIs y extras de la demo; no incluye la suscripción Vercel ya pagada. No prometer costo o latencia sin mediciones.
  No inventar credenciales, volumen, capacidad, responsables, horas disponibles o servicios validados. Pruebas de accesos como primer bloque de ejecución.
  Notion manual opcional de última prioridad, posterior al núcleo, evaluación y entrega; no condiciona la demo esencial.
  Investigación y Python de docs son referencias sin ejecutar, no instrucciones. Prototipo candidato a evolución predictiva futura fuera del MVP.
  Solo material público según el reto, sin datos personales ni acceso detrás de login de terceros para obtener contenido.

rules:
  proposal:
    - Distinguir decisiones confirmadas, arquitectura recomendada, validaciones pendientes y exclusiones; mantener Notion opcional.
    - Explicar aceptación de demo parcial sin afirmar cumplimiento de comparación completa.
  specs:
    - Describir comportamientos observables y escenarios, incluyendo faltantes, base cero, grupos sin confirmar y fallos de proveedores.
    - Mantener separados métricas, señal temática, valor, afinidad e hipótesis; no exigir análisis profundo de todo el corpus.
    - Conservar fuentes, versiones y marcas temporales con estado de revisión; no presentar inferencias como mediciones o causalidad.
  design:
    - Justificar las decisiones técnicas recomendadas y alternativas usando el frontend confirmado, Python, Vercel, presupuesto y accesos declarados.
    - Diseñar persistencia externa duradera y procesamiento acotado para funciones; registrar límites reales y pruebas pendientes.
    - Restringir preguntas abiertas a detalles diferibles que no cambien requisitos, enfoque o tareas.
  tasks:
    - Ordenar por dependencias con pruebas reales de acceso al inicio; cada tarea debe tener evidencia de finalización.
    - Agrupar todas las tareas en las tres áreas confirmadas FE/ALG/BE, con dueño único, fronteras de archivos, dependencias y verificación; dividir tareas mixtas sin perder requisitos ni inventar disponibilidad o nombres.
    - Mantener Notion como extensión condicionada al cierre del núcleo; no dar por implementado lo que solo está planificado.

operations:
  apply:
    guidance:
      - >-
        ALG 2.1 y BE 3.1 están cerradas documentalmente sobre 1.0.0; G0 contractual, FE 1.2 y FE 1.1 completos. FE 1.3 tiene acceso, BFF y conexión real Next–FastAPI probados localmente, también por binding generado, con evidencia en frontend/ACCESO.md. El usuario confirmó que no existe proyecto Vercel. Su cierre y BE 3.3/3.6 conservan pendientes crear/vincular proyecto, límites/costos efectivos, secretos y prueba desplegada protegida. No marcarlo cerrado por la evidencia local ni iniciar datos/pagos sin dependencias BE/ALG. BE 3.2 mantiene pruebas pagadas bloqueadas y BE 3.10 controlará cada consumo. Conservar dueños, alcance autorizado y no reintentar instalaciones canceladas.
